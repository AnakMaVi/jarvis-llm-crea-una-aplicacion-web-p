<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Citas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Calendario de Citas para la Barbería Moderna</h1>
    </header>
    <main>
        <section id="calendar-container">
            <div id="calendar"></div>
        </section>
        <form id="appointment-form">
            <label for="date">Fecha:</label>
            <input type="date" id="date" name="date" required>
            <label for="time">Hora:</label>
            <select id="time" name="time" required>
                <option value="09:00">9:00 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="13:00">1:00 PM</option>
                <option value="14:00">2:00 PM</option>
                <option value="15:00">3:00 PM</option>
                <option value="16:00">4:00 PM</option>
                <option value="17:00">5:00 PM</option>
            </select>
            <label for="cortes">Corte:</label>
            <select id="cortes" name="cortes" required>
                <option value="corte1">Corte 1</option>
                <option value="corte2">Corte 2</option>
                <option value="corte3">Corte 3</option>
            </select>
            <button type="submit">Reservar Cita</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
