<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Citas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Barbería Moderna</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="book-appointment.html">Reserva de Citas</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="appointment-form">
            <h2>Reserva de Cita</h2>
            <form action="/submit-appointment" method="POST">
                <label for="name">Nombre Completo:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Teléfono:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Servicio:</label>
                <select id="service" name="service" required>
                    <option value="corte-corto">Corte Corto</option>
                    <option value="corte-medio">Corte Medio</option>
                    <option value="corte-largo">Corte Largo</option>
                    <option value="manicura">Manicura</option>
                    <option value="pedicura">Pedicura</option>
                    <option value="corte-y-manicura">Corte y Manicura</option>
                </select>

                <label for="date">Fecha:</label>
                <input type="date" id="date" name="date" required>

                <label for="time">Hora:</label>
                <input type="time" id="time" name="time" required>

                <button type="submit">Reservar Cita</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Barbería Moderna</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
